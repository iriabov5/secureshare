services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-secureshare}
      POSTGRES_USER: ${DB_USER:-secureshare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secureshare-local-password}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  s3:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-secureshare-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secureshare-local-secret}
      S3_BUCKET: ${S3_BUCKET:-secureshare}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data
volumes:
  s3-data:
  postgres-data:
